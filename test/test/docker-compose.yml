version: '3.8'

services:
  # Base de datos (Infraestructura corregida)
  db:
    image: postgres:15-alpine
    container_name: chatbot-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=chatbot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Microservicio de Inventario
  inventario:
    image: chatbot-inventario-service:latest
    container_name: chatbot-inventario
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/chatbot_db

# Definición del volumen para que no se borren tus datos
volumes:
  postgres_data: