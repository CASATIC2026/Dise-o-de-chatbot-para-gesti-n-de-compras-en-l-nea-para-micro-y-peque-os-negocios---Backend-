version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: chatbot-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventario-service:
    build:
      context: ./src/Services.Inventario
      dockerfile: Dockerfile
    container_name: inventario-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped

  pagos-service:
    build:
      context: ./src/Services.Pagos
      dockerfile: Dockerfile
    container_name: pagos-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - Wompi__PublicKey=${WOMPI_PUBLIC_KEY}
      - Wompi__PrivateKey=${WOMPI_PRIVATE_KEY}
      - Wompi__WebhookSecret=${WOMPI_WEBHOOK_SECRET}
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network
    restart: unless-stopped

  gateway:
    build:
      context: ./src/Gateway.NodeJS
      dockerfile: Dockerfile
    container_name: gateway-service
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${GATEWAY_PORT}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - INVENTARIO_SERVICE_URL=http://inventario-service:8080
      - PAGOS_SERVICE_URL=http://pagos-service:8080
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - postgres
      - inventario-service
      - pagos-service
    networks:
      - chatbot-network
    restart: unless-stopped

  admin-web:
    build:
      context: ./src/Admin.Web
      dockerfile: Dockerfile
    container_name: admin-web
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - chatbot-network
    restart: unless-stopped

networks:
  chatbot-network:
    driver: bridge

volumes:
  postgres_data:
