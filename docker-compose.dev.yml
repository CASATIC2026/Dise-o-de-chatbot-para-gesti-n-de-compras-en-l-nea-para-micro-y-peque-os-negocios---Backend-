services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: chatbot-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inventory Microservice (.NET 8)
  inventario-service:
    build:
      context: ./src
      dockerfile: Services.Inventario/Dockerfile.dev
    container_name: inventario-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # CAMBIO: Host=postgres para coincidir con el nombre del servicio arriba
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}    
      - JWT_SECRET=f9a2b8c7e6d5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b
    volumes:
      - ./src/Services.Inventario:/src/Services.Inventario
      - ./src/Shared.Core:/src/Shared.Core
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chatbot-network

  # Node.js Gateway & Chatbot
  gateway:
    build:
      context: ./src/Gateway.NodeJS
      dockerfile: Dockerfile.dev
    container_name: gateway-service
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${GATEWAY_PORT}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL}
      - INVENTARIO_SERVICE_URL=http://inventario-service:8080
      - PAGOS_SERVICE_URL=http://pagos-service:8080
    volumes:
      - ./src/Gateway.NodeJS:/app
      - /app/node_modules
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    depends_on:
      - postgres
      - inventario-service
    networks:
      - chatbot-network

  # Admin Web Panel (React)
  admin-web:
    build:
      context: ./src/Admin.Web
      dockerfile: Dockerfile.dev
    container_name: admin-web
    environment:
      - VITE_API_URL=http://localhost:${GATEWAY_PORT}
    volumes:
      - ./src/Admin.Web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    networks:
      - chatbot-network

networks:
  chatbot-network:
    driver: bridge

volumes:
  postgres_data:
    name: postgres_data